# Azunote settings. This file uses TOML syntax.
# External tools are defined below the tools/ directory.

# Font used by the editor and its renderer.
fontFamily = "Consolas"
fontSize = 14

# Detailed operation logs are disabled by default. Available categories are
# "all", "render", "clipboard", "key", and "input".
[debug]
logging = []

# Configure the status bar's "Open Folder in Terminal" command here.
[terminal]
command = "wt.exe"
args = ["-d", "${documentDir}"]
workingDirectory = "${documentDir}"

# Configure the status bar's "Show in Explorer" command here.
[explorer]
command = "explorer.exe"
args = ["/select,\"${file}\""]
workingDirectory = "${documentDir}"
