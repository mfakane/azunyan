# Azunote settings. This file uses TOML syntax.
# External tools are defined below the tools/ directory.

# Font used by the editor and its renderer.
fontFamily = "Consolas"
fontSize = 14

# Detailed operation logs are disabled by default. Available categories are
# "all", "render", "clipboard", "key", and "input".
[debug]
logging = []

# External tools. PowerShell tools start faster when a process is already
# waiting. powerShellWarmIdleProcesses is how many wait while nothing is
# running; use 0 to keep none waiting until a run asks for them.
# powerShellWarmProcesses is the most that may wait at once, which a run known
# to launch several processes, such as one using per, reserves for that run
# only. Leave it unset to use half the logical processor count, between 1 and
# 4, which suits most machines.
[tools]
powerShellWarmIdleProcesses = 1
# powerShellWarmProcesses = 4

# Configure the status bar's "Open Folder in Terminal" command here.
[terminal]
command = "wt.exe"
args = ["-d", "${documentDirname}"]
workingDirectory = "${documentDirname}"

# Configure the status bar's "Show in Explorer" command here.
[explorer]
command = "explorer.exe"
args = ["/select,\"${file}\""]
workingDirectory = "${documentDirname}"
