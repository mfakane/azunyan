name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (major.minor, for example 0.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # Win2D requires the Windows 10 SDK 19041, which is not present on the
    # Windows Server 2025 image currently selected by windows-latest.
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out repository and pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+$') {
              throw 'Version must be major.minor, for example 0.2.'
          }
          $parts = $version.Split('.')
          if (@($parts | Where-Object { [long]$_ -gt 65535 }).Count) {
              throw 'Each version part must be between 0 and 65535.'
          }
          $tag = "v$version.$env:GITHUB_RUN_NUMBER"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
              throw "Tag $tag already exists."
          }
          "PACKAGE_VERSION=$version.$env:GITHUB_RUN_NUMBER.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Win2D Visual Studio components
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/setup.exe'
          $installPath = & $vswhere -latest -products '*' -property installationPath
          if ([string]::IsNullOrWhiteSpace($installPath)) {
              throw 'Visual Studio installation was not found.'
          }

          $configPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/win2d.vsconfig'
          $arguments = @(
              'modify'
              '--installPath'
              "`"$installPath`""
              '--config'
              "`"$configPath`""
              '--passive'
              '--norestart'
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru
          if ($process.ExitCode) {
              throw "Visual Studio component installation failed with exit code $($process.ExitCode)."
          }

          $deadline = (Get-Date).AddMinutes(10)
          do {
              $msbuild = & $vswhere -latest -products '*' -requiresAny `
                  -requires Microsoft.VisualStudio.ComponentGroup.UWP.VC.v143 Microsoft.VisualStudio.ComponentGroup.UWP.VC `
                  -find 'MSBuild\Current\Bin\MSBuild.exe'
              if ($msbuild) {
                  break
              }
              Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          if (!$msbuild) {
              throw 'Visual Studio UWP C++ components were not available after installation.'
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.2
        with:
          version: v0.7.1

      - name: Verify WinApp CLI
        shell: pwsh
        run: winapp --version

      - name: Build pinned Win2D package
        shell: pwsh
        run: ./scripts/Build-Win2D.ps1

      - name: Restore solution
        shell: pwsh
        run: dotnet restore Azunyan.slnx

      - name: Build solution
        shell: pwsh
        run: dotnet build Azunyan.slnx -c Debug --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet test Azunyan.slnx -c Debug --no-build --no-restore

      - name: Package unsigned MSIX and portable ZIP
        shell: pwsh
        run: |
          ./scripts/Package-AzunoteMsix.ps1 `
              -Release `
              -Version $env:PACKAGE_VERSION `
              -OutputDirectory artifacts/distributions
          ./scripts/Package-AzunoteZip.ps1 `
              -Release `
              -Version $env:PACKAGE_VERSION `
              -OutputDirectory artifacts/distributions

      - name: Tag and open a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Unsigned MSIX and portable ZIP.
          Package version: $env:PACKAGE_VERSION
          "@
          $files = @(Get-ChildItem -LiteralPath artifacts/distributions -File)
          if ($files.Count -lt 2) {
              throw 'Expected MSIX and ZIP outputs.'
          }
          gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --draft `
              --target $env:GITHUB_SHA `
              --title "Azunote $env:RELEASE_VERSION" `
              --notes $notes `
              @($files.FullName)
