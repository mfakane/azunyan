name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (major.minor, for example 0.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+$') {
              throw 'Version must be major.minor, for example 0.2.'
          }
          $parts = $version.Split('.')
          if (@($parts | Where-Object { [long]$_ -gt 65535 }).Count) {
              throw 'Each version part must be between 0 and 65535.'
          }
          $tag = "v$version.$env:GITHUB_RUN_NUMBER"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
              throw "Tag $tag already exists."
          }
          "package_version=$version.$env:GITHUB_RUN_NUMBER.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build:
    name: Build, test, and package
    needs: validate
    uses: ./.github/workflows/build-msix.yml
    with:
      version: ${{ needs.validate.outputs.package_version }}
      release: true

  release:
    name: Tag and open a draft release
    needs: [validate, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: azunote-*
          path: artifacts/distributions
          merge-multiple: true

      - name: Tag and open a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          $notes = @"
          Unsigned installer and portable ZIPs for Windows x64 and ARM64.
          - Azunote-$env:PACKAGE_VERSION.msixbundle: MSIX bundle for both architectures; Windows installs the one matching the device.
          - Azunote-$env:PACKAGE_VERSION-win-x64.zip / -win-arm64.zip: portable ZIP for each architecture.
          Package version: $env:PACKAGE_VERSION
          "@
          # The bundle is the installer; per-architecture MSIX stay CI artifacts.
          $names = @("Azunote-$env:PACKAGE_VERSION.msixbundle")
          foreach ($rid in @('win-x64', 'win-arm64')) {
              $names += "Azunote-$env:PACKAGE_VERSION-$rid.zip"
          }
          $files = foreach ($name in $names) {
              foreach ($file in @($name, "$name.sha256")) {
                  $path = Join-Path artifacts/distributions $file
                  if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Expected $file." }
                  (Get-Item -LiteralPath $path).FullName
              }
          }
          gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --draft `
              --target $env:GITHUB_SHA `
              --title "Azunote $env:RELEASE_VERSION" `
              --notes $notes `
              @($files)
