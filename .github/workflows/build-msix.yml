name: Build and package MSIX

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Optional four-part package version (for example, 0.1.0.42)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository and pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.1
        with:
          version: v0.6.1

      - name: Verify WinApp CLI
        shell: pwsh
        run: winapp --version

      - name: Build pinned Win2D package
        shell: pwsh
        run: ./scripts/Build-Win2D.ps1

      - name: Restore solution
        shell: pwsh
        run: dotnet restore Azunyan.slnx

      - name: Build solution
        shell: pwsh
        run: dotnet build Azunyan.slnx -c Debug --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet test Azunyan.slnx -c Debug --no-build --no-restore

      - name: Package unsigned MSIX
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
              $version = "0.1.0.$env:GITHUB_RUN_NUMBER"
          }

          ./scripts/Package-AzunoteMsix.ps1 `
              -Version $version `
              -OutputDirectory artifacts/distributions

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: azunote-msix
          path: |
            artifacts/distributions/*.msix
            artifacts/distributions/*.sha256
          if-no-files-found: error
